function meetingCard(m){return `&lt;article class=&quot;at-meeting&quot;&gt;&lt;div class=&quot;at-meeting-time&quot;&gt;${meetingClock(m)}&lt;small&gt;${zone()} · ${m.duration} min&lt;/small&gt;&lt;/div&gt;&lt;div&gt;&lt;h3&gt;${escape(m.company)} &lt;span style=&quot;color:var(--at-muted);font-weight:400&quot;&gt;/ ${escape(m.type)}&lt;/span&gt;&lt;/h3&gt;&lt;p&gt;${escape(m.role)}&lt;/p&gt;&lt;div class=&quot;at-meeting-meta&quot;&gt;&lt;span class=&quot;at-badge ${m.status===&#x27;Completed&#x27;?&#x27;ready&#x27;:&#x27;interview&#x27;}&quot;&gt;${m.status}&lt;/span&gt;&lt;span&gt;${m.round}&lt;/span&gt;${icon(m.mode===&#x27;Phone call&#x27;?&#x27;phone&#x27;:&#x27;video&#x27;)}&lt;span&gt;${m.mode}&lt;/span&gt;&lt;/div&gt;&lt;/div&gt;${button(&#x27;View details&#x27;,&#x27;meeting:&#x27;+m.id,false,&#x27;arrow-up-right&#x27;)}&lt;/article&gt;`}
