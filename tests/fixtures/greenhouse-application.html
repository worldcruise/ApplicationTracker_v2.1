<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Software Engineer - Test Employer</title>
<script type="application/ld+json">{"@context":"https://schema.org","@type":"JobPosting","title":"Software Engineer","description":"Build reliable software with JavaScript and SQL.","hiringOrganization":{"@type":"Organization","name":"Test Employer"}}</script>
<style>.select__single-value:empty {display:none} [hidden]{display:none!important} .file-upload {margin:12px 0}</style>
</head><body>
<h1>Software Engineer</h1><h2>Test Employer</h2><p>Build reliable software with JavaScript and SQL.</p>
<form id="application-form">
  <label for="first_name">First Name</label><input id="first_name" name="firstName" aria-required="true" autocomplete="given-name">
  <label for="last_name">Last Name</label><input id="last_name" name="lastName" aria-required="true" autocomplete="family-name">
  <label for="email">Email</label><input id="email" name="email" type="email" aria-required="true" autocomplete="email">
  <div class="select"><label id="country-label" for="country">Country</label>
    <div class="select-shell"><div class="select__single-value"></div>
      <input id="country" role="combobox" aria-controls="country-options" aria-expanded="false" aria-required="true" aria-labelledby="country-label" autocomplete="off">
      <input type="hidden" name="country">
    </div>
  </div>
  <div class="file-upload" role="group" aria-labelledby="upload-label-resume" aria-required="true">
    <div id="upload-label-resume">Resume/CV</div><div><button type="button">Attach</button><label for="resume">Attach</label><input id="resume" type="file" style="display:none" accept=".pdf,.doc,.docx,.txt,.rtf"></div>
    <span id="resume-filename"></span>
  </div>
  <div class="file-upload" role="group" aria-labelledby="upload-label-cover_letter"><div id="upload-label-cover_letter">Cover Letter</div><div><label for="cover_letter">Attach</label><input id="cover_letter" type="file" style="display:none"></div></div>
  <button type="submit">Submit application</button>
</form>
<div id="country-options" role="listbox" hidden></div>
<script>
// Simulate the DOM contract of react-select: typing filters options; only an
// option click commits the hidden value and clears the search input.
const country=document.getElementById('country'),menu=document.getElementById('country-options');
function renderCountries(){
  menu.hidden=false;country.setAttribute('aria-expanded','true');menu.replaceChildren();
  for(const [value,label] of [['GB','United Kingdom +44'],['US','United States +1'],['CA','Canada +1']]){
    if(country.value&&!label.toLowerCase().includes(country.value.toLowerCase()))continue;
    const option=document.createElement('div');option.setAttribute('role','option');option.textContent=label;
    option.addEventListener('mousedown',event=>event.preventDefault());
    option.addEventListener('click',()=>{
      document.querySelector('.select__single-value').textContent=label;
      document.querySelector('input[name=country]').value=value;
      country.value='';country.setAttribute('aria-expanded','false');menu.hidden=true;
    });menu.append(option);
  }
}
country.addEventListener('focus',renderCountries);country.addEventListener('input',renderCountries);
country.addEventListener('keydown',event=>{if(event.key==='ArrowDown')renderCountries();});
document.getElementById('resume').addEventListener('change',event=>{document.getElementById('resume-filename').textContent=event.target.files[0]?.name||'';});
document.querySelector('form').addEventListener('submit',event=>{event.preventDefault();document.body.dataset.submitted='true';});
</script></body></html>
